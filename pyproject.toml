[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "fogws"
version = "0.0.1"
description = "Observable Rust-powered WebSocket library for Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AMBER FOG" }]
keywords = ["asyncio", "observability", "rust", "telemetry", "websocket"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet",
]
dependencies = []

[project.urls]
CodeOfConduct = "https://github.com/AmberFog/fogws/blob/main/CODE_OF_CONDUCT.md"
Contributing = "https://github.com/AmberFog/fogws/blob/main/CONTRIBUTING.md"
Documentation = "https://github.com/AmberFog/fogws#readme"
Homepage = "https://github.com/AmberFog/fogws"
Issues = "https://github.com/AmberFog/fogws/issues"
Repository = "https://github.com/AmberFog/fogws"
Security = "https://github.com/AmberFog/fogws/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7,<8",
    "faker>=40,<41",
    "hypothesis>=6,<7",
    "mypy>=2.1,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-timeout>=2,<3",
    "ruff>=0.15,<0.16",
    "websockets==16.1.1",
]

[tool.maturin]
exclude = ["CONTEXT.md"]
features = ["extension-module"]
module-name = "fogws._fogws"
python-source = "."

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
testpaths = ["tests"]
timeout = 20
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["fogws"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["fogws", "tests"]
strict = true
warn_unreachable = true
warn_unused_configs = true
pretty = true
show_error_codes = true
namespace_packages = false
